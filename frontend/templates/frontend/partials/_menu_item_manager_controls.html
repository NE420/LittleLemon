{# Manager-only. Expects `item` and `categories`. The API gives item.category as the category's title. #}
<details class="inline-disclosure">
  <summary class="btn btn-ghost btn-sm">Edit item</summary>
  <div class="inline-body">
    <form method="post" action="{% url 'frontend:single-menu-item' item.id %}" class="form-stack">
      {% csrf_token %}
      <input type="hidden" name="action" value="update" />
      <input type="hidden" name="next_query" value="{{ request.GET.urlencode }}" />
      <div class="field">
        <label for="edit-title-{{ item.id }}">Title</label>
        <input id="edit-title-{{ item.id }}" name="title" class="input" value="{{ item.title }}" required />
      </div>
      <div class="field">
        <label for="edit-price-{{ item.id }}">Price</label>
        <input id="edit-price-{{ item.id }}" name="price" type="number" step="0.01" min="0" class="input" value="{{ item.price }}" required />
      </div>
      <div class="field">
        <label for="edit-category-{{ item.id }}">Category</label>
        <select id="edit-category-{{ item.id }}" name="category" class="select" required>
          {% for category in categories %}
          <option value="{{ category.title }}"{% if category.title == item.category %} selected{% endif %}>{{ category.title }}</option>
          {% endfor %}
        </select>
      </div>
      <label class="check" for="edit-featured-{{ item.id }}">
        <input type="checkbox" name="featured" id="edit-featured-{{ item.id }}"{% if item.featured %} checked{% endif %} />
        Featured
      </label>
      <button class="btn btn-dark btn-sm btn-block" type="submit">Save changes</button>
    </form>

    <form method="post" action="{% url 'frontend:single-menu-item' item.id %}" class="inline-form" style="margin-top: 10px;">
      {% csrf_token %}
      <input type="hidden" name="action" value="delete" />
      <input type="hidden" name="next_query" value="{{ request.GET.urlencode }}" />
      <button class="btn btn-danger btn-sm btn-block" type="submit" onclick="return confirm('Delete {{ item.title|escapejs }}?');">Delete item</button>
    </form>
  </div>
</details>
