{# Manager-only. Expects `item` and `categories`. Item.category is a bare id from the API. #}
<div class="dropdown">
  <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" id="menuItemDropdown{{ item.id }}" data-bs-toggle="dropdown" aria-expanded="false">
    Edit item
  </button>
  <div class="dropdown-menu p-3 shadow-sm" aria-labelledby="menuItemDropdown{{ item.id }}" style="min-width: 18rem;">
    <form method="post" action="{% url 'frontend:single-menu-item' item.id %}" class="row g-3">
      {% csrf_token %}
      <input type="hidden" name="action" value="update" />
      <input type="hidden" name="next_query" value="{{ request.GET.urlencode }}" />
      <div class="col-12">
        <label class="form-label small text-muted" for="edit-title-{{ item.id }}">Title</label>
        <input id="edit-title-{{ item.id }}" name="title" class="form-control form-control-sm" value="{{ item.title }}" required />
      </div>
      <div class="col-12">
        <label class="form-label small text-muted" for="edit-price-{{ item.id }}">Price</label>
        <input id="edit-price-{{ item.id }}" name="price" type="number" step="0.01" min="0" class="form-control form-control-sm" value="{{ item.price }}" required />
      </div>
      <div class="col-12">
        <label class="form-label small text-muted" for="edit-category-{{ item.id }}">Category</label>
        <select id="edit-category-{{ item.id }}" name="category" class="form-select form-select-sm" required>
          {% for category in categories %}
          <option value="{{ category.id }}"{% if category.id == item.category %} selected{% endif %}>{{ category.title }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="featured" id="edit-featured-{{ item.id }}"{% if item.featured %} checked{% endif %} />
          <label class="form-check-label small" for="edit-featured-{{ item.id }}">Featured</label>
        </div>
      </div>
      <div class="col-12">
        <button class="btn btn-primary btn-sm w-100" type="submit">Save changes</button>
      </div>
    </form>

    <form method="post" action="{% url 'frontend:single-menu-item' item.id %}" class="mt-2">
      {% csrf_token %}
      <input type="hidden" name="action" value="delete" />
      <input type="hidden" name="next_query" value="{{ request.GET.urlencode }}" />
      <button class="btn btn-outline-danger btn-sm w-100" type="submit" onclick="return confirm('Delete {{ item.title|escapejs }}?');">Delete item</button>
    </form>
  </div>
</div>
