{# Expects `page` from views.paginate(). Renders nothing when there is only one page. #}
{% if page.has_other_pages %}
<nav class="pager" aria-label="Pagination">
  <a class="btn btn-ghost btn-sm"{% if page.has_previous %} href="?page={{ page.previous_number }}{{ page.query }}"{% else %} aria-disabled="true"{% endif %}>Previous</a>
  <span class="here">Page {{ page.number }}</span>
  <a class="btn btn-ghost btn-sm"{% if page.has_next %} href="?page={{ page.next_number }}{{ page.query }}"{% else %} aria-disabled="true"{% endif %}>Next</a>
  <p class="count">{{ page.count }} in total</p>
</nav>
{% endif %}
