{# Manager-only. Include inside {% if is_manager %}. #}
<details class="disclosure">
  <summary>Add a category</summary>
  <div class="disclosure-body">
    <form method="post" class="form-grid">
      {% csrf_token %}
      <input type="hidden" name="action" value="create" />
      <div class="field">
        <label for="category-title">Title</label>
        <input id="category-title" name="title" class="input" required />
      </div>
      <div class="field">
        <label for="category-slug">Slug</label>
        <input id="category-slug" name="slug" class="input" required />
      </div>
      <div><button type="submit" class="btn btn-primary">Add category</button></div>
    </form>
  </div>
</details>
