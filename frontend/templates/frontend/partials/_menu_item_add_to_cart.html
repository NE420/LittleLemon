{# Customer-only. Expects `item`. Posts to the cart view. #}
<form method="post" action="{% url 'frontend:cart' %}" class="add-form">
  {% csrf_token %}
  <input type="hidden" name="action" value="add" />
  <input type="hidden" name="item_id" value="{{ item.id }}" />
  <div class="field">
    <label for="qty-{{ item.id }}">Quantity</label>
    <input id="qty-{{ item.id }}" class="input input-qty" type="number" name="quantity" value="1" min="1" />
  </div>
  <button type="submit" class="btn btn-primary">Add to cart</button>
</form>
