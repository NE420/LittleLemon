{# Managers and delivery crew. Expects `order`, and `crew` for managers. #}
<details class="inline-disclosure">
  <summary class="btn btn-ghost btn-sm">Update order</summary>
  <div class="inline-body">
    <form method="post" action="{% url 'frontend:single-order' order.id %}" class="form-stack">
      {% csrf_token %}
      <input type="hidden" name="next_query" value="{{ request.GET.urlencode }}" />
      <div class="field">
        <label for="status-{{ order.id }}">Status</label>
        <select id="status-{{ order.id }}" name="status" class="select">
          <option value="0"{% if not order.status %} selected{% endif %}>Pending</option>
          <option value="1"{% if order.status %} selected{% endif %}>Completed</option>
        </select>
      </div>
      {% if is_manager and crew %}
      <div class="field">
        <label for="crew-{{ order.id }}">Delivery crew</label>
        <select id="crew-{{ order.id }}" name="delivery_crew" class="select">
          <option value=""{% if not order.delivery_crew %} selected{% endif %}>Unassigned</option>
          {% for member in crew %}
          <option value="{{ member.id }}"{% if member.id == order.delivery_crew %} selected{% endif %}>{{ member.username }}</option>
          {% endfor %}
        </select>
      </div>
      {% endif %}
      <button type="submit" class="btn btn-dark btn-sm btn-block">Save order</button>
    </form>
  </div>
</details>
