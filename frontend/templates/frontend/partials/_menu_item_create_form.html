{# Manager-only. Expects `categories`. Include inside {% if is_manager %}. #}
<div class="card shadow-sm border-0 rounded-4 mb-4">
  <div class="card-body">
    <h3 class="h5 fw-semibold mb-3">Add a menu item</h3>
    <form method="post" class="row g-3 align-items-end">
      {% csrf_token %}
      <input type="hidden" name="action" value="create" />
      <div class="col-12 col-md-4">
        <label class="form-label small text-muted" for="new-item-title">Title</label>
        <input id="new-item-title" name="title" class="form-control" required />
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label small text-muted" for="new-item-price">Price</label>
        <input id="new-item-price" name="price" type="number" step="0.01" min="0" class="form-control" required />
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label small text-muted" for="new-item-category">Category</label>
        <select id="new-item-category" name="category" class="form-select" required>
          <option value="" disabled selected>Select a category</option>
          {% for category in categories %}
          <option value="{{ category.id }}">{{ category.title }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-12 col-md-2">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="featured" id="new-item-featured" />
          <label class="form-check-label" for="new-item-featured">Featured</label>
        </div>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-success">Add menu item</button>
      </div>
    </form>
  </div>
</div>
